<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>S.G.S.P — Sistema Gestão Columbófila</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family: Tahoma, 'Segoe UI', Arial, sans-serif; background:#d4d0c8; overflow:hidden}
    ::-webkit-scrollbar{width:14px;height:14px}
    ::-webkit-scrollbar-track{background:#d4d0c8;border:1px solid #a0a0a0}
    ::-webkit-scrollbar-thumb{background:#ece9d8;border:1px outset #fff}
    ::-webkit-scrollbar-thumb:active{background:#d4d0c8;border:1px inset #fff}
    input, select, button{font-family: Tahoma, Arial, sans-serif; font-size:12px}
    input{border:2px inset #fff; padding:3px 4px; background:#fff}
    select{border:2px inset #fff; padding:2px; background:#fff}
  </style>
</head>

  <div id="root"></div>
